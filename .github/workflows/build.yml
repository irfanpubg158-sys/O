name: Build APK with Kivy Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build with Kivy Docker
      run: |
        docker run --rm \
          -v $(pwd):/home/user/hostcwd \
          -w /home/user/hostcwd \
          kivy/buildozer \
          buildozer android debug deploy run

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TekAI-APK
        path: bin/*.apk
