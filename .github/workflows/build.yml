name: Build apk

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: oppo-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kütüphaneleri Kur
        run: pip install pyinstaller opencv-python pillow

      - name: apk Yap
        run: pyinstaller --onefile --noconsole kilit.py

      - name: EXE'yi Yükle
        uses: actions/upload-artifact@v4
        with:
          name: kilit-apk
          path: dist/kilit.apk
